name: Deploy Elyjen to DigitalOcean

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_IMAGE_NAME: elyjen-shop-app
  DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_HUB_USERNAME }}/elyjen-shop-app:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            mkdir -p ~/elyjen-shop
            cd ~/elyjen-shop

            cat << 'EOF' > docker-compose.yml
            services:
              web:
                image: ${{ env.DOCKER_IMAGE_TAG }}
                container_name: elyjen-shop-app
                restart: unless-stopped
                ports:
                  - "3000:3000"
                env_file:
                  - .env.local
                deploy:
                  resources:
                    limits:
                      memory: 180M
                    reservations:
                      memory: 80M
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOF

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker-compose pull
            docker-compose up -d
            docker image prune -f

            echo "Waiting for server to be ready..."
            sleep 20
            until curl -sf http://localhost:3000 > /dev/null; do
              echo "Server not ready yet, waiting 5s..."
              sleep 5
            done

            echo "Server is ready! Starting ISR warmup..."
            SLUGS=$(curl -s http://localhost:3000/api/warmup/products 2>/dev/null || echo "[]")
            echo "Found slugs: $SLUGS"

            echo "$SLUGS" | tr -d '[]"' | tr ',' '\n' | while read SLUG; do
              SLUG=$(echo "$SLUG" | tr -d ' ')
              if [ -n "$SLUG" ]; then
                curl -s "http://localhost:3000/product/$SLUG" > /dev/null
                echo "Warmed up: /product/$SLUG"
              fi
            done

            echo "ISR warmup complete!"
