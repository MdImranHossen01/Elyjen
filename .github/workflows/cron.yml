name: Daily Courier Delivery Status Cron Sync

on:
  schedule:
    # Runs once daily at 00:00 UTC (06:00 AM Bangladesh time)
    - cron: '0 0 * * *'
  # Also allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-courier-status:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Courier Delivery Status from Steadfast
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="3v5NdIZ3wq8cidXg78fwzEn7SZULDwuNNRcH1kqQqiE"
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $SECRET" \
            "https://www.elyjen.shop/api/cron/sync-courier-status")
          echo "Response HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "❌ Courier sync failed with HTTP $response"
            exit 1
          else
            echo "✅ Courier sync completed successfully"
          fi
